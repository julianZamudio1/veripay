spring:
  application:
    name: veripay
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    # Igual que el context-root de jboss-web.xml: la app vive en /veripay tanto standalone como en WildFly
    context-path: /veripay
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

veripay:
  jwt:
    # Obligatorio fuera del perfil dev: variable de entorno VERIPAY_JWT_SECRETO (mínimo 32 caracteres).
    # Sin valor por defecto a propósito: si falta, la aplicación no arranca.
    secreto: ${VERIPAY_JWT_SECRETO:}
    expiracion-minutos: 120
  biometria:
    # facial: OpenCV YuNet + SFace (similitud coseno, umbral 0.363) · perceptual: hashes de imagen (pruebas)
    motor: facial
  banco:
    clave-banco: "646"
    clave-plaza: "180"
  cors:
    origenes: http://localhost:4200
  admin:
    username: admin
    # Si está vacío no se crea el administrador inicial
    password: ${VERIPAY_ADMIN_PASSWORD:}
  demo-datos: false

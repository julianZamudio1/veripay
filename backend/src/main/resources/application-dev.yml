# Perfil de desarrollo: H2 en archivo, consola H2 y datos demo
spring:
  datasource:
    url: jdbc:h2:file:./data/veripay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# Valores SOLO para desarrollo local. Son públicos (están en el repositorio).
veripay:
  demo-datos: true
  jwt:
    secreto: solo-desarrollo-no-usar-en-produccion-0123456789
  admin:
    password: Admin123!
